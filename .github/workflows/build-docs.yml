name: Build Docs

on:
  push:
    branches:
      - main
      - stable/2026.1-m3
  pull_request:
env:
  PYTHON_VERSION: '3.12'
jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
    steps:
      - uses: actions/checkout@v2
      - name: Setup python
        uses: actions/setup-python@v2
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Tox
        run: pip install tox
      - name: Build docs
        run: tox -e docs
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        if: ${{ github.ref == 'refs/heads/stable/2026.1-m3' }}
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./doc/build/html
